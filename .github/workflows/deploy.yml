name: Deploy assessment

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1

        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.PORT }}

          script: |
            cd domains/promptedit-assessment.adityakunhare.com/prompt-edit-app

            git pull origin main

            composer install --no-dev --optimize-autoloader

            php artisan migrate --force

            npm ci
            npm run build

            php artisan optimize:clear
            php artisan optimize

            # Copy public files to website root
            rsync -av --delete public/ ../public_html/

            # Update Laravel paths in deployed index.php
            sed -i "s|__DIR__.'/../bootstrap/app.php'|__DIR__.'/../prompt-edit-app/bootstrap/app.php'|g" ../public_html/index.php

            sed -i "s|__DIR__.'/../storage/framework/maintenance.php'|__DIR__.'/../prompt-edit-app/storage/framework/maintenance.php'|g" ../public_html/index.php

            sed -i "s|__DIR__.'/../vendor/autoload.php'|__DIR__.'/../prompt-edit-app/vendor/autoload.php'|g" ../public_html/index.php